# ============================================================================
# ShopPk CI/CD Pipeline
# ============================================================================
#
# Architecture: Supabase Edge Functions + Vercel (Next.js)
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN    — personal access token from supabase.com/account/tokens
#   SUPABASE_PROJECT_REF     — project ref (pxawbeabanhomemluson)
#   VERCEL_STOREFRONT_DEPLOY_HOOK — Vercel deploy webhook URL for storefront
#   VERCEL_ADMIN_DEPLOY_HOOK      — Vercel deploy webhook URL for admin
#
# Job flow:
#   lint ──┐
#          ├─→ test ──→ deploy-functions   (on push to main/develop)
#   typecheck ─┘    └─→ build ──→ deploy-vercel  (on push to main/develop)
# ============================================================================

name: ShopPk CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Lint Job
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # ---------------------------------------------------------------------------
  # Type Check Job
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Type Check
        run: |
          bunx tsc --noEmit -p apps/storefront/tsconfig.json
          bunx tsc --noEmit -p apps/admin/tsconfig.json

  # ---------------------------------------------------------------------------
  # Test Job
  # (No PostgreSQL/Redis services — backend is Supabase, not NestJS)
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Run tests
        run: bun run test --passWithNoTests

  # ---------------------------------------------------------------------------
  # Build Job (storefront + admin only — API is Edge Functions, not built here)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Build Storefront
        run: bunx nx build storefront --prod

      - name: Build Admin
        run: bunx nx build admin --prod

  # ---------------------------------------------------------------------------
  # Deploy Edge Functions to Supabase
  # Runs on every push to main or develop (and manual dispatch).
  # Uses Supabase CLI — deploys ALL functions under supabase/functions/.
  # Only changed functions incur re-deployment cost; unchanged ones are no-ops.
  # ---------------------------------------------------------------------------
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          supabase functions deploy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy Vercel (storefront + admin)
  # Triggers Vercel deploy hooks after a successful build.
  # Vercel builds from source — the build job above validates it compiles first.
  # ---------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    steps:
      - name: Trigger Storefront Deploy
        run: curl -fsSL -X POST "${{ secrets.VERCEL_STOREFRONT_DEPLOY_HOOK }}"

      - name: Trigger Admin Deploy
        run: curl -fsSL -X POST "${{ secrets.VERCEL_ADMIN_DEPLOY_HOOK }}"
