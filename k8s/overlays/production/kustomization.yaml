# ============================================================================
# Production Overlay
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopnx-production

resources:
  - ../../base

commonLabels:
  environment: production

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 3
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: storefront
    spec:
      replicas: 3
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: admin
    spec:
      replicas: 2

# Production-specific configurations
# - Pod Disruption Budgets
# - Network Policies
# - Resource quotas
