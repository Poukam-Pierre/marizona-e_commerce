# ============================================================================
# Storefront Deployment (Base)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: shopnx
    component: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnx
      component: storefront
  template:
    metadata:
      labels:
        app: shopnx
        component: storefront
    spec:
      containers:
        - name: storefront
          image: ghcr.io/shopnx/shopnx/storefront:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: shopnx-config
                  key: api-url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app: shopnx
    component: storefront
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: shopnx
    component: storefront
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
