# ============================================================================
# Ingress Configuration
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnx-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - shopnx.com
        - www.shopnx.com
      secretName: shopnx-tls
    - hosts:
        - admin.shopnx.com
      secretName: admin-tls
    - hosts:
        - api.shopnx.com
      secretName: api-tls
  rules:
    # Storefront
    - host: shopnx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 3000
    - host: www.shopnx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 3000
    # Admin
    - host: admin.shopnx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3001
    # API
    - host: api.shopnx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3002
