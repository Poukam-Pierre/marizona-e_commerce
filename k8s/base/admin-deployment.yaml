# ============================================================================
# Admin Deployment (Base)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: shopnx
    component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopnx
      component: admin
  template:
    metadata:
      labels:
        app: shopnx
        component: admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/shopnx/shopnx/admin:latest
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: shopnx-config
                  key: admin-api-url
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    app: shopnx
    component: admin
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: shopnx
    component: admin
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
