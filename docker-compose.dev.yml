# ============================================================================
# ShopPk - Docker Compose for Local Development
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: shoppk-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoppk
      POSTGRES_PASSWORD: shoppk_dev_secret
      POSTGRES_DB: shoppk
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppk -d shoppk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoppk-dev-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shoppk-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoppk-dev-network

  # ---------------------------------------------------------------------------
  # Adminer - Database Management UI (Development only)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: shoppk-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - shoppk-dev-network
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # Redis Commander - Redis Management UI (Development only)
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: shoppk-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - shoppk-dev-network
    profiles:
      - tools

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  shoppk-dev-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
